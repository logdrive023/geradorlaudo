name: Deploy GitHub Pages

# Só publica quando houver push nesta branch (a main não é tocada).
on:
  push:
    branches: [feat/react-vite-ia]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
        env:
          BASE: /${{ github.event.repository.name }}/
      # Rotas fixas ganham página própria (respondem 200); o resto cai no 404.html,
      # que abre o app: /laudo/<id> funciona e endereço inexistente mostra a página "não encontrada".
      - name: Páginas das rotas
        run: |
          cp dist/index.html dist/404.html
          for r in entrar cadastrar esqueci painel configuracoes usuarios termos privacidade sobre; do
            mkdir -p "dist/$r" && cp dist/index.html "dist/$r/index.html"
          done
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
