# Render — site estático do LaudoTech (sem backend ainda).
# New → Blueprint → este repo. Publica a branch feat/react-vite-ia.
services:
  - type: web
    name: laudotech
    runtime: static
    branch: feat/react-vite-ia
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      # SPA: qualquer rota abre o app (o React Router decide a página)
      - type: rewrite
        source: /*
        destination: /index.html
